---
- name: Validate role parameters
  ansible.builtin.assert:
    that:
      - nagiosconfig_flavor in [ 'core', 'xi' ]
      - nagiosconfig_mode in [ 'always', 'never', 'once' ]
    fail_msg: nagiosconfig_flavor must be core or xi, nagiosconfig_mode must be always, never or once.

- name: Find the tenant directories
  ansible.builtin.find:
    paths: "{{ __nagiosconfig_hosts_dir }}"
    file_type: directory
    recurse: false
  register: __nagiosconfig_tenant_dirs
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
  when: __nagiosconfig_tenants | length > 0

- name: Validate the target tenants
  ansible.builtin.assert:
    that:
      - nagiosconfig_hosts_path | length > 0
      - __nagiosconfig_tenants | difference(__nagiosconfig_tenant_names) | length == 0
    fail_msg: "Unknown tenant {{ __nagiosconfig_tenants | difference(__nagiosconfig_tenant_names) | join(', ') }} under {{ __nagiosconfig_hosts_dir }}. Available: {{ __nagiosconfig_tenant_names | sort | join(', ') }}."
    success_msg: "Rendering the hosts and services of {{ __nagiosconfig_tenants | join(', ') }} only, nagiosconfig_clean_assets is ignored."
  vars:
    __nagiosconfig_tenant_names: "{{ __nagiosconfig_tenant_dirs.files | map(attribute='path') | map('basename') | list }}"
  when: __nagiosconfig_tenants | length > 0

- name: Load target dependent variables
  ansible.builtin.include_vars:
    file: "{{ lookup('ansible.builtin.first_found', __nagiosconfig_target_files) }}"
    name: __nagiosconfig_target_defaults
  vars:
    __nagiosconfig_target_files:
      files:
        - "{{ nagiosconfig_flavor }}-{{ ansible_facts['distribution'] }}_{{ ansible_facts['distribution_major_version'] }}.yaml"
        - "{{ nagiosconfig_flavor }}-{{ ansible_facts['distribution'] }}.yaml"
        - "{{ nagiosconfig_flavor }}-{{ ansible_facts['os_family'] }}_{{ ansible_facts['distribution_major_version'] }}.yaml"
        - "{{ nagiosconfig_flavor }}-{{ ansible_facts['os_family'] }}.yaml"
        - "{{ nagiosconfig_flavor }}.yaml"
      paths:
        - "{{ role_path }}/vars"

- name: Set target parameters
  ansible.builtin.set_fact:
    nagiosconfig_target: "{{ __nagiosconfig_target_defaults | combine(nagiosconfig_target, recursive=true) }}"
