---
- name: Validate target parameters
  ansible.builtin.assert:
    that:
      - nagiosconfig_target.command | default('') | length > 0
      - nagiosconfig_target.etc_path | default('') | length > 0
      - nagiosconfig_target.group | default('') | length > 0
      - nagiosconfig_target.objects_path | default('') | length > 0
      - nagiosconfig_target.plugins_path | default('') | length > 0
      - nagiosconfig_target.user | default('') | length > 0
    fail_msg: nagiosconfig_target is incomplete.

- name: Read the live nagios configuration
  ansible.builtin.slurp:
    src: "{{ nagiosconfig_target.etc_path }}/nagios.cfg"
  register: __nagiosconfig_main_cfg

- name: List the object directories declared in nagios.cfg
  ansible.builtin.set_fact:
    __nagiosconfig_declared_dirs: >-
      {{ (__nagiosconfig_main_cfg.content | b64decode).splitlines()
         | select('match', '^\s*cfg_dir\s*=')
         | map('regex_replace', '^\s*cfg_dir\s*=\s*', '')
         | map('trim')
         | map('regex_replace', '/$', '')
         | list }}

- name: List the object directories missing from nagios.cfg
  ansible.builtin.set_fact:
    __nagiosconfig_missing_dirs: >-
      {{ __nagiosconfig_cfg_dirs
         | map('regex_replace', '^', nagiosconfig_target.objects_path ~ '/')
         | reject('match', '^(' ~ (__nagiosconfig_declared_dirs | map('regex_escape') | join('|') | default('(?!)', true)) ~ ')(/|$)')
         | list }}

- name: Assert the object directories are declared in nagios.cfg
  ansible.builtin.assert:
    that:
      - __nagiosconfig_missing_dirs | length == 0
    fail_msg: "No cfg_dir entry in {{ nagiosconfig_target.etc_path }}/nagios.cfg covers {{ __nagiosconfig_missing_dirs | join(', ') }}. This role never writes nagios.cfg, declare them there first."
  when: nagiosconfig_assert_cfg_dirs | bool

- name: Create the object directories
  ansible.builtin.file:
    path: "{{ nagiosconfig_target.objects_path }}/{{ item }}"
    state: directory
    owner: "{{ nagiosconfig_target.user }}"
    group: "{{ nagiosconfig_target.group }}"
    mode: "0750"
  loop: "{{ __nagiosconfig_cfg_dirs }}"

- name: Find the staging directories left by previous runs
  ansible.builtin.find:
    paths: "{{ nagiosconfig_tempdir_base }}"
    patterns: "{{ __nagiosconfig_tempdir_prefix }}*"
    file_type: directory
    recurse: false
  register: __nagiosconfig_tempdir_stale
  changed_when: false
  check_mode: false
  when: nagiosconfig_tempdir_cleanup | bool

- name: Remove the staging directories left by previous runs
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ __nagiosconfig_tempdir_stale.files | default([]) | map(attribute='path') | list }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Create a temporary directory
  ansible.builtin.tempfile:
    state: directory
    path: "{{ nagiosconfig_tempdir_base }}"
    prefix: "{{ __nagiosconfig_tempdir_prefix }}"
  register: __nagiosconfig_tempdir
  changed_when: false
  check_mode: false

- name: Set the temporary directory ownership
  ansible.builtin.file:
    path: "{{ __nagiosconfig_tempdir.path }}"
    owner: "{{ nagiosconfig_target.user }}"
    group: "{{ nagiosconfig_target.group }}"
  changed_when: false
  check_mode: false

- name: Set the staged objects root
  ansible.builtin.set_fact:
    __nagiosconfig_stage_dir: "{{ __nagiosconfig_tempdir.path }}/objects"

- name: Create the staged objects root
  ansible.builtin.file:
    path: "{{ __nagiosconfig_stage_dir }}"
    state: directory
    owner: "{{ nagiosconfig_target.user }}"
    group: "{{ nagiosconfig_target.group }}"
    mode: "0750"
  changed_when: false
  check_mode: false

- name: Create the temporary object directories
  ansible.builtin.file:
    path: "{{ __nagiosconfig_stage_dir }}/{{ item }}"
    state: directory
    owner: "{{ nagiosconfig_target.user }}"
    group: "{{ nagiosconfig_target.group }}"
    mode: "0750"
  loop: "{{ __nagiosconfig_cfg_dirs }}"
  changed_when: false
  check_mode: false

- name: Copy the live objects to the temporary directory
  ansible.builtin.command:
    cmd: rsync -a --owner --group --perms --itemize-changes "{{ nagiosconfig_target.objects_path }}/{{ item }}/" "{{ __nagiosconfig_stage_dir }}/{{ item }}/"
  register: __nagiosconfig_rsync_temp
  loop: "{{ __nagiosconfig_cfg_dirs }}"
  changed_when: false
  failed_when: __nagiosconfig_rsync_temp.rc != 0
  check_mode: false
  when: not __nagiosconfig_clean_assets | bool

- name: Copy the live configuration to the temporary directory
  ansible.builtin.command:
    cmd: rsync -a --owner --group --perms --itemize-changes "{{ nagiosconfig_target.etc_path }}/nagios.cfg" "{{ __nagiosconfig_tempdir.path }}/nagios.cfg"
  register: __nagiosconfig_rsync_cfg
  changed_when: false
  failed_when: __nagiosconfig_rsync_cfg.rc != 0
  check_mode: false

- name: Point the temporary configuration at the temporary objects
  ansible.builtin.replace:
    path: "{{ __nagiosconfig_tempdir.path }}/nagios.cfg"
    regexp: '^([ \t]*cfg_dir[ \t]*=[ \t]*){{ nagiosconfig_target.objects_path | regex_escape }}(?=/|[ \t]*$)'
    replace: '\1{{ __nagiosconfig_stage_dir }}'
  changed_when: false
  check_mode: false

- name: Create the temporary object templates
  ansible.builtin.template:
    src: "{{ item }}.cfg.j2"
    dest: "{{ __nagiosconfig_stage_dir }}/templates/{{ item }}.cfg"
    mode: "0664"
    force: "{{ nagiosconfig_mode == 'always' }}"
  check_mode: false
  loop:
    - commands
    - contact_templates
    - host_templates
    - service_templates
    - time_templates

- name: Create the temporary object assets
  ansible.builtin.template:
    src: "{{ item }}.cfg.j2"
    dest: "{{ __nagiosconfig_stage_dir }}/assets/{{ item }}.cfg"
    mode: "0664"
    force: "{{ nagiosconfig_mode == 'always' }}"
  check_mode: false
  loop:
    - contacts
    - groups_definition

- name: Find the host definition files
  ansible.builtin.find:
    paths: "{{ __nagiosconfig_hosts_find_paths }}"
    patterns:
      - "*.yaml"
      - "*.yml"
    excludes:
      - _tenant.yaml
    file_type: file
    recurse: true
  register: __nagiosconfig_hosts_find
  delegate_to: localhost
  become: false

- name: Create the host and service definitions
  ansible.builtin.include_tasks: host_definition.yml
  loop: "{{ __nagiosconfig_hosts_find.files | map(attribute='path') | list }}"
  loop_control:
    loop_var: __nagiosconfig_host_file
    label: "{{ __nagiosconfig_host_file | basename }}"

- name: Validate the staged nagios configuration
  ansible.builtin.command:
    cmd: "{{ nagiosconfig_target.command }} -v {{ __nagiosconfig_tempdir.path }}/nagios.cfg"
  register: __nagiosconfig_validation
  changed_when: false
  failed_when: false
  check_mode: false

- name: Show the validation output
  ansible.builtin.debug:
    msg: "{{ __nagiosconfig_validation.stdout_lines }}"

- name: Apply the staged objects
  ansible.builtin.command:
    cmd: rsync -a --owner --group --perms --delete --itemize-changes "{{ __nagiosconfig_stage_dir }}/{{ item }}/" "{{ nagiosconfig_target.objects_path }}/{{ item }}/"
  register: __nagiosconfig_rsync_apply
  loop: "{{ __nagiosconfig_cfg_dirs }}"
  changed_when: __nagiosconfig_rsync_apply.stdout | length > 0
  failed_when: __nagiosconfig_rsync_apply.rc != 0
  when: __nagiosconfig_validation.rc == 0
  notify:
    - Reload nagios core
    - Apply nagios xi configuration

- name: Remove the temporary directory
  ansible.builtin.file:
    path: "{{ __nagiosconfig_tempdir.path }}"
    state: absent
  changed_when: false
  check_mode: false
  when: __nagiosconfig_validation.rc == 0

- name: Fail when the staged configuration is invalid
  ansible.builtin.fail:
    msg: "The staged configuration did not pass {{ nagiosconfig_target.command }} -v. Nothing was applied, the staged tree is kept at {{ __nagiosconfig_stage_dir }} with its main configuration at {{ __nagiosconfig_tempdir.path }}/nagios.cfg. The next run of this role removes it, set nagiosconfig_tempdir_cleanup=false to keep it."
  when: __nagiosconfig_validation.rc != 0
