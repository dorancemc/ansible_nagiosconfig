---
# core  objects under the nagios etc path, one cfg_dir per object directory
# xi    objects under /usr/local/nagios/etc/static, not visible in the CCM
nagiosconfig_flavor: core

# once   write the monitoring objects only where nothing exists yet
# always this role owns the monitoring objects and overwrites them
# never  another role owns the monitoring objects, do not touch them
nagiosconfig_mode: once

# true deletes every object file on the target that this role does not generate
nagiosconfig_clean_assets: false

# fail when the managed directories are not reachable from a cfg_dir entry of
# the live nagios.cfg, which this role never writes
nagiosconfig_assert_cfg_dirs: true

# root where the staging tree is created; the pre-run cleanup never looks
# outside this path
nagiosconfig_tempdir_base: /tmp

# remove the staging trees left by previous runs before creating a new one;
# false keeps a failed tree around for inspection
nagiosconfig_tempdir_cleanup: true

# these objects are the same for Core and XI, so an inventory keeps them in the
# group that is the parent of both products, not in the group of one of them
# shared object files, loaded one by one so the tenant dicts merge instead of
# replacing each other; empty disables the lookup
nagiosconfig_base_path: ""

# relative paths are resolved against the role directory
nagiosconfig_hosts_path: files/nagios_hosts

# tenants, directory names under nagiosconfig_hosts_path, whose hosts and
# services are rendered; a list or a comma separated string, empty renders every
# tenant. Shared objects are still rendered in full, and nagiosconfig_clean_assets
# is ignored while it is set
nagiosconfig_tenants: []

# plugins the commands invoke that the installation does not ship: downloaded
# to the target plugins_path, with checksum
nagiosconfig_extra_plugins: {}

nagiosconfig_host_template_default: server
nagiosconfig_service_template_default: generic-service

nagiosconfig_hostgroups:
  local: {}
  cloud: {}

nagiosconfig_servicegroups:
  localresources: {}

# paths and identities of the target installation, loaded from
# vars/<flavor>[-<os>].yaml; whatever is defined here is merged on top
nagiosconfig_target: {}
