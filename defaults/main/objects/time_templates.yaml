# https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/3/en/objectdefinitions.html#timeperiod
---
nagiosconfig_timeperiods: {}
nagiosconfig_timeperiods_default:
  24x7:
    alias: 24 Hours A Day, 7 Days A Week
    sunday: 00:00-24:00
    monday: 00:00-24:00
    tuesday: 00:00-24:00
    wednesday: 00:00-24:00
    thursday: 00:00-24:00
    friday: 00:00-24:00
    saturday: 00:00-24:00
  workhours:
    alias: Normal Work Hours
    monday: 07:00-17:00
    tuesday: 07:00-17:00
    wednesday: 07:00-17:00
    thursday: 07:00-17:00
    friday: 07:00-17:00
  none:
    alias: No Time Is A Good Time
  co-holidays:
    alias: CO Holidays
    january 1: 00:00-00:00 ; New Years
    may 1: 00:00-00:00 ; Dia del trabajo
    july 20: 00:00-00:00 ; Dia Independencia
    august 7: 00:00-00:00 ; Dia Independencia
    december 25: 00:00-00:00 ; Navidad
  24x7_sans_holidays:
    alias: 24x7 Sans Holidays
    use: co-holidays ; Get holiday exceptions from other timeperiod
    sunday: 00:00-24:00
    monday: 00:00-24:00
    tuesday: 00:00-24:00
    wednesday: 00:00-24:00
    thursday: 00:00-24:00
    friday: 00:00-24:00
    saturday: 00:00-24:00
